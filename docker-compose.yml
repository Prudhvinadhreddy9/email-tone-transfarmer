# docker-compose for local dev. One command to bring everything up:
#   docker-compose up
#
# Prereqs:
#   - Create a .env file at this directory based on .env.example.
#   - OPENAI_API_KEY is read from that .env automatically (Compose default behavior).
#
# WHY a profile-less default: you'll typically `up` everything. If you want to
# bring services up individually use `docker-compose up backend`.

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Need to set OPENAI_API_KEY in .env}
      # When the frontend container talks to the backend it uses the service
      # name; from your browser to the backend it's localhost:8080.
      EMAIL_TONE_CORS_ALLOWED_ORIGINS: "http://localhost:5173"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        # Browser-side URL — the browser is on the host, NOT the docker network,
        # so this must be the host port, not the service name.
        VITE_API_BASE_URL: "http://localhost:8080"
    ports:
      - "5173:5173"
    depends_on:
      - backend
